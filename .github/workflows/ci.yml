name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, lint, and type-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and development tools
        run: |
          set -o pipefail
          {
            python -m pip install --upgrade pip
            python -m pip install -e ".[dev]"
          } 2>&1 | tee install.log

      - name: Run unit tests
        run: |
          set -o pipefail
          python -m pytest -vv 2>&1 | tee pytest.log

      - name: Run Ruff
        if: always()
        run: |
          set -o pipefail
          ruff check . 2>&1 | tee ruff.log

      - name: Run mypy
        if: always()
        run: |
          set -o pipefail
          mypy src tests 2>&1 | tee mypy.log

      - name: Run Bandit security scan
        if: always()
        run: |
          set -o pipefail
          bandit -q -r src 2>&1 | tee bandit.log

      - name: Audit installed dependencies
        if: always()
        run: |
          set -o pipefail
          python -m pip install pip-audit 2>&1 | tee pip-audit-install.log
          pip-audit 2>&1 | tee pip-audit.log

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            install.log
            pytest.log
            ruff.log
            mypy.log
            bandit.log
            pip-audit-install.log
            pip-audit.log
          if-no-files-found: warn
          retention-days: 14
