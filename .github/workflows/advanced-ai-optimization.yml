name: Advanced AI Optimization Research

on:
  push:
    branches:
      - feat/ai-advanced-optimization
    paths:
      - ".github/workflows/advanced-ai-optimization.yml"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: Public hourly history length in days
        type: choice
        options: ["365", "730"]
        default: "730"
        required: true
      n_trials:
        description: Optuna trials per model per fold
        type: choice
        options: ["5", "10", "20"]
        default: "10"
        required: true

permissions:
  contents: read

concurrency:
  group: advanced-ai-optimization-research
  cancel-in-progress: true

jobs:
  advanced-meta-label-research:
    name: Bounded public-data and walk-forward meta-label research
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out selected ref
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install bounded research dependencies
        run: |
          set -o pipefail
          python --version 2>&1 | tee python-version.log
          python -m pip install --upgrade pip 2>&1 | tee pip-install.log
          python -m pip install -e ".[dev,regime,regime-upgrade]" 2>&1 | tee research-dependencies.log
          python -m pip install pip-audit 2>&1 | tee pip-audit-install.log
      - name: Run Ruff before public network access
        run: |
          set -o pipefail
          python -m ruff check . 2>&1 | tee ruff.log
      # Keep public-history retrieval behind all static, test, and dependency gates, including import order.
      - name: Run strict typing before public network access
        run: |
          set -o pipefail
          python -m mypy src/evoryn/learning_lab/advanced_meta_label.py tests/unit/test_advanced_meta_label.py scripts/evaluate_advanced_meta_label.py 2>&1 | tee mypy.log
      - name: Run focused static security scan before public network access
        run: |
          set -o pipefail
          python -m bandit -q scripts/evaluate_advanced_meta_label.py 2>&1 | tee bandit.log
      - name: Run offline CI suite
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee pytest.log
      - name: Audit research environment
        run: |
          set -o pipefail
          pip-audit 2>&1 | tee pip-audit.log
      - name: Download public hourly history and create immutable dataset
        run: |
          set -o pipefail
          DAYS="${{ inputs.lookback_days || '730' }}"
          python scripts/train_nobitex_regime.py \
            --symbol BTCUSDT \
            --resolution 60 \
            --lookback-days "$DAYS" \
            --max-pages 40 \
            --fetch-only \
            --output artifacts/nobitex-regime 2>&1 | tee public-history-run.log
      - name: Run strict walk-forward feature-selection and meta-label study
        run: |
          set -o pipefail
          TRIALS="${{ inputs.n_trials || '10' }}"
          python scripts/evaluate_advanced_meta_label.py \
            --n-trials "$TRIALS" \
            --seed 41 \
            --top-k 15 \
            --probability-threshold 0.55 \
            --output artifacts/nobitex-regime 2>&1 | tee advanced-meta-label-run.log
      - name: Upload research artifacts and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advanced-ai-optimization-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/nobitex-regime/training-report.json
            artifacts/nobitex-regime/training-report.json.sha256
            artifacts/nobitex-regime/datasets/
            artifacts/nobitex-regime/advanced-meta-label/
            python-version.log
            pip-install.log
            research-dependencies.log
            ruff.log
            mypy.log
            bandit.log
            pip-audit-install.log
            pip-audit.log
            pytest.log
            public-history-run.log
            advanced-meta-label-run.log
          if-no-files-found: warn
          retention-days: 90
          # Dataset candles, manifest, and model evidence must be archived together.
