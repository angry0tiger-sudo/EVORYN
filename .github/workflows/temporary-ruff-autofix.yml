name: Temporary safe Ruff autofix

on:
  push:
    branches:
      - feat/phase19-shadow-mode

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Phase 19 branch
        uses: actions/checkout@v4
        with:
          ref: feat/phase19-shadow-mode
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install "ruff>=0.6.9"
      - name: Apply safe auto-fixes only and push reviewed scope
        run: |
          set -e
          ruff check --fix . || true
          git diff --stat
          if git diff --quiet; then
            echo "No safe automatic Ruff fixes available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: apply safe Ruff autofixes across existing code"
          git push origin HEAD:feat/phase19-shadow-mode
