[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evoryn"
version = "0.1.0"
description = "Modular adaptive trading-intelligence platform foundation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.entry-points."evoryn.exchanges"]
nobitex = "evoryn.adapters.exchanges.nobitex:NobitexExchangePlugin"

[project.optional-dependencies]
dev = ["bandit>=1.7.10", "mypy>=1.11.2", "pytest>=8.3.3", "ruff>=0.6.9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_unreachable = true
show_error_codes = true

[tool.bandit]
exclude_dirs = ["tests"]
